name: Check Signal production collector release

on:
  push:
    branches: [codex/signal-collector-filter-20261009]

permissions:
  contents: read

jobs:
  production-release:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify public website release and HTTP health
        env:
          EXPECTED_RELEASE: '5862f30dcdd5dafdae7181f4fd831bfee6665e82'
        run: |
          node --input-type=module <<'NODE'
          const origin = "https://holdrich.online";
          const expected = process.env.EXPECTED_RELEASE;
          for (let attempt = 1; attempt <= 16; attempt += 1) {
            try {
              const response = await fetch(origin + "/wecom?releaseCheck=" + Date.now(), {
                cache: "no-store",
                signal: AbortSignal.timeout(20_000),
              });
              if (response.status !== 200) throw new Error("Public page HTTP " + response.status);
              const html = await response.text();
              const urls = [...new Set([...html.matchAll(/<script[^>]+src="([^"]+)"/g)]
                .map((match) => new URL(match[1].replaceAll("&amp;", "&"), origin))
                .filter((url) => url.origin === origin && url.pathname.startsWith("/_next/static/"))
                .map((url) => url.href))];
              const assets = await Promise.allSettled(urls.map(async (url) => {
                const asset = await fetch(url, { cache: "no-store", signal: AbortSignal.timeout(20_000) });
                if (!asset.ok) throw new Error("Asset HTTP " + asset.status);
                return asset.text();
              }));
              const versionAssets = assets.filter((entry) => entry.status === "fulfilled")
                .map((entry) => entry.value)
                .filter((asset) => asset.includes("/api/deployment-version"));
              const versions = [...new Set(versionAssets.flatMap((asset) =>
                [...asset.matchAll(/["']([a-f0-9]{40})["']/g)].map((match) => match[1])))];
              console.log(JSON.stringify({ attempt, pageStatus: response.status, scriptCount: urls.length, versions }));
              if (versionAssets.some((asset) => asset.includes(expected))) {
                console.log("Verified public website release and HTTP health: " + expected);
                process.exit(0);
              }
            } catch (error) {
              console.log(JSON.stringify({ attempt, error: error.message }));
            }
            if (attempt < 16) await new Promise((resolve) => setTimeout(resolve, 30_000));
          }
          throw new Error("The expected production release was not verified within the check window");
          NODE
